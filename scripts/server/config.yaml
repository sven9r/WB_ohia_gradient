# trimflow reads this file beside trimflow.py unless TRIMFLOW_CONFIG points
# to another YAML file. Run trimflow from the directory containing your reads.

# Use the bundled paper-specific ANML table beside trimflow.py. Its sequences
# and expected insert length are copied from the supplied primer database.
use_bundled_primer_database: true
primer_database_path: "primer_database.csv"

# A custom configuration can retain online downloading by setting
# use_bundled_primer_database to false and providing its own google_sheet_id.

# An empty value selects the bundled trim_fasta.sh beside trimflow.py.
# Set an absolute path here to deliberately use another compatible engine.
trim_fasta_path: ""

# Barcode labels are entered at the interactive prompt, e.g. A,B,C.
# Each label expands to the exact sequence that must precede the forward primer.
# Enter X at the prompt for reads with no inline barcode; X is handled by the
# wrapper and therefore does not require an entry in this mapping.
inline_barcodes:
  A: ATCACG
  B: CGATGT
  C: TTAGGC
  D: TGACCA
  E: GCCAAT
  F: CAGATC
